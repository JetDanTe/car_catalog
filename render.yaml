services:
  - type: web
    name: car-catalog
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: uvicorn car_catalog.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/cars.db
    disk:
      name: car-catalog-data
      mountPath: /var/data
      sizeGB: 1



